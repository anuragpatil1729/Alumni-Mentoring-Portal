# MySQL JDBC Connection Properties
db.host=localhost
db.port=3306
db.name=alumni_mentoring_portal
db.user=alumni_user
db.password=alumni_password

# JDBC Driver Class
db.driver=com.mysql.cj.jdbc.Driver

# JDBC URL Settings
db.params=useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# HTTP REST Server Port
server.port=5001

# TCP Registration Socket Port
socket.port=5002
